<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Santa Clara Lead Engine</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f5f7f7;--card:#fff;--ink:#17211d;--muted:#67726d;--line:#dfe5e2;--accent:#24584d;--danger:#9a2d2d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.wrap{max-width:1500px;margin:auto;padding:14px}
button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
button.alt{background:#eef3f1;color:#26342f;border:1px solid #d4ddda}button.danger{background:#fff;color:var(--danger);border:1px solid #e6caca}
input,select,textarea{width:100%;border:1px solid #cbd4d0;border-radius:8px;padding:9px;background:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.panel h2{font-size:14px;margin:0;padding:11px 13px;border-bottom:1px solid var(--line)}
.login{max-width:430px;margin:70px auto;padding:20px}.login h2{margin:0 0 8px}.small{font-size:12px;color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.num{font-size:24px;font-weight:800}.lbl{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:12px}#map{height:560px;border-radius:0 0 12px 12px}
.tablewrap{max-height:560px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#fafbfb;font-size:10px;color:var(--muted);text-transform:uppercase}tr.lead{cursor:pointer}tr.lead:hover{background:#fafcfc}
.pill{display:inline-block;font-size:10px;padding:2px 6px;margin:1px 2px 1px 0;background:#eef2f4;border-radius:999px}.editor{display:none;margin-bottom:12px}.editor.on{display:block}
.editorBody{padding:14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.checks label{font-size:12px}.checks input{width:auto}
.status{margin-bottom:10px;padding:9px 11px;border-radius:8px;background:#eef6f3;color:#24473f;font-size:12px;display:none}
.viewtabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.viewtab{background:#fff;color:#26342f;border:1px solid var(--line)}.viewtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;margin-bottom:4px}.badge.property{background:#edf3f1;color:#31554c}.badge.distressed{background:#fdeaea;color:#922f2f}
tr.distressed-row{background:#fff9f9}tr.distressed-row:hover{background:#fff3f3}
@media(max-width:950px){.filters{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
<div><h1>Santa Clara Lead Engine</h1><div class="sub">Private cloud database · hosted app</div></div>
<div class="row" id="topActions" style="display:none">
<button id="add">Add lead</button><button id="csv" class="alt">Export CSV</button><button id="lock" class="alt">Lock</button>
</div>
</header>

<div class="wrap">
<section id="login" class="panel login">
<h2>Private access</h2>
<p class="small">Enter your private access key. It stays in this browser only.</p>
<input id="accessKey" type="password" placeholder="Access key" autocomplete="off">
<div style="margin-top:10px"><button id="unlock">Unlock lead engine</button></div>
<div id="loginError" class="small" style="color:#9a2d2d;margin-top:9px"></div>
</section>

<div id="app" style="display:none">
<div id="statusMsg" class="status"></div>
<section id="editor" class="panel editor"><h2 id="editTitle">Lead</h2><div class="editorBody">
<input id="leadId" type="hidden"><div class="form">
<label>Address<input id="address"></label><label>City<input id="city" value="Santa Clara"></label>
<label>Owner<input id="owner"></label><label>Value / prior ask<input id="value" type="number"></label>
<label>DOM<input id="dom" type="number"></label><label>Years owned<input id="years" type="number"></label>
<label>Equity %<input id="equity" type="number"></label><label>Appreciation %<input id="appreciation" type="number"></label>
<label>Units<input id="units" type="number" min="1" max="4" value="1"></label>
<label>Lead type<select id="leadType"><option>Property</option><option>Distressed</option></select></label>
<label>Distress reason<select id="distressReason"><option value="">—</option><option>Pre-foreclosure / NOD</option><option>Vacant / abandoned</option><option>Probate / inherited</option><option>Tax delinquency</option><option>Code / condition issues</option><option>Failed listing</option><option>Other</option></select></label>
<label>Status<select id="leadStatus"><option>New</option><option>Researching</option><option>Contacted</option><option>Follow-up</option><option>Report mailed</option><option>Appointment</option><option>Not a lead</option></select></label>
<div class="full"><div class="small"><b>Motivation signals</b></div><div class="checks">
<label><input id="expired" type="checkbox"> Expired/withdrawn</label>
<label><input id="preforeclosure" type="checkbox"> Pre-foreclosure/NOD</label>
<label><input id="probate" type="checkbox"> Probate/inherited</label>
<label><input id="remodel" type="checkbox"> Remodel/rebuild</label>
<label><input id="absentee" type="checkbox"> Absentee</label>
</div></div>
<label class="full">Notes<textarea id="notes" rows="4"></textarea></label>
<div class="full row"><button id="save" type="button">Save</button><button id="showMap" type="button" class="alt">Show on map</button><button id="delete" type="button" class="danger">Delete</button><button id="cancel" type="button" class="alt">Cancel</button></div>
</div></div></section>

<div class="viewtabs">
<button class="viewtab active" data-view="All">All properties</button>
<button class="viewtab" data-view="Property">Regular properties</button>
<button class="viewtab" data-view="Distressed">Distressed properties</button>
</div>
<div class="filters">
<input id="search" placeholder="Search address or owner">
<input id="cityFilter" value="Santa Clara">
<input id="min" type="number" value="1000000">
<input id="max" type="number" value="4000000">
<select id="signalFilter"><option value="">All motivation</option><option value="long">Long ownership</option><option value="expired">Expired</option><option value="preforeclosure">Pre-foreclosure</option><option value="probate">Probate</option><option value="remodel">Remodel</option><option value="absentee">Absentee</option><option value="highdom">High DOM</option><option value="multifamily">2–4 units</option></select>
</div>

<div class="cards">
<div class="card"><div id="total" class="num">0</div><div class="lbl">Visible leads</div></div>
<div class="card"><div id="regularCount" class="num">0</div><div class="lbl">Regular properties</div></div>
<div class="card"><div id="distressedCount" class="num">0</div><div class="lbl">Distressed properties</div></div>
<div class="card"><div id="hot" class="num">0</div><div class="lbl">Hot (70+)</div></div>
</div>

<div class="grid">
<section class="panel"><h2>Map</h2><div id="map"></div></section>
<section class="panel"><h2>Ranked leads</h2><div class="tablewrap"><table><thead><tr><th>Score</th><th>Property</th><th>Why</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</div>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
"use strict";
const API="https://bpzhnbpsoawlpapztssl.supabase.co/functions/v1/lead-api";
const KEY_STORE="lead-engine-access-key";
let accessKey=localStorage.getItem(KEY_STORE)||"";
let leads=[], map=null, markers=[], currentView="All";

const $=id=>document.getElementById(id);
const n=v=>{v=Number(v);return isFinite(v)?v:0};
function score(x){let s=0;if(x.preforeclosure)s+=30;if(x.expired)s+=25;if(x.probate)s+=22;if(n(x.years_owned)>=15)s+=15;if(n(x.equity_pct)>=60)s+=15;if(n(x.dom)>=90)s+=15;else if(n(x.dom)>=60)s+=8;if(n(x.appreciation_pct)>=100)s+=12;if(n(x.units)>=2&&n(x.units)<=4)s+=12;if(x.remodel)s+=10;if(x.absentee)s+=10;return Math.min(100,s)}
function why(x){let a=[];if(x.preforeclosure)a.push("NOD");if(x.expired)a.push("Expired");if(x.probate)a.push("Probate");if(n(x.years_owned)>=15)a.push(n(x.years_owned)+" yrs owned");if(n(x.equity_pct)>=60)a.push(n(x.equity_pct)+"% equity");if(n(x.dom)>=60)a.push(n(x.dom)+" DOM");if(n(x.appreciation_pct)>=100)a.push("High appreciation");if(n(x.units)>=2)a.push(n(x.units)+" units");if(x.remodel)a.push("Remodel");if(x.absentee)a.push("Absentee");return a}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function msg(t){$("statusMsg").textContent=t;$("statusMsg").style.display="block";setTimeout(()=>{$("statusMsg").style.display="none"},3500)}
async function api(body){
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","x-lead-key":accessKey},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||"Request failed");
 return d;
}
function initMap(){
 if(map)return;
 map=L.map("map").setView([37.3541,-121.9552],15);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
}
function clearMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[]}
function drawMarkers(list){
 initMap();clearMarkers();
 list.forEach(x=>{if(x.lat&&x.lng){const m=L.marker([x.lat,x.lng]).addTo(map).bindPopup("<b>"+esc(x.address)+"</b><br>Score "+score(x));markers.push(m)}});
}
async function geocodeLead(x,zoom){
 try{
  const q=encodeURIComponent(x.address+", "+x.city+", CA");
  const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+q);
  const d=await r.json();if(!d.length)return null;
  const lat=Number(d[0].lat),lng=Number(d[0].lon);
  if(zoom){initMap();map.setView([lat,lng],17)}
  return [lat,lng];
 }catch(e){return null}
}
function filtered(){
 const q=$("search").value.toLowerCase().trim(),city=$("cityFilter").value.toLowerCase().trim(),min=n($("min").value),max=n($("max").value),sf=$("signalFilter").value;
 return leads.filter(x=>{
  if(currentView!=="All"&&(x.lead_type||"Property")!==currentView)return false;
  if(q&&((x.address+" "+(x.owner_name||"")).toLowerCase().indexOf(q)<0))return false;
  if(city&&(x.city||"").toLowerCase()!==city)return false;
  if(min&&n(x.estimated_value)<min)return false;if(max&&n(x.estimated_value)>max)return false;
  if(sf==="long"&&n(x.years_owned)<15)return false;if(sf==="expired"&&!x.expired)return false;if(sf==="preforeclosure"&&!x.preforeclosure)return false;if(sf==="probate"&&!x.probate)return false;if(sf==="remodel"&&!x.remodel)return false;if(sf==="absentee"&&!x.absentee)return false;if(sf==="highdom"&&n(x.dom)<90)return false;if(sf==="multifamily"&&!(n(x.units)>=2&&n(x.units)<=4))return false;
  return true;
 }).sort((a,b)=>score(b)-score(a));
}
function render(){
 const list=filtered();
 $("total").textContent=list.length;
 $("regularCount").textContent=leads.filter(x=>(x.lead_type||"Property")==="Property").length;
 $("distressedCount").textContent=leads.filter(x=>(x.lead_type||"Property")==="Distressed").length;
 $("hot").textContent=list.filter(x=>score(x)>=70).length;
 const tb=$("rows");tb.innerHTML="";
 list.forEach(x=>{
  const tr=document.createElement("tr");
  const type=(x.lead_type||"Property");
  tr.className="lead"+(type==="Distressed"?" distressed-row":"");
  const rs=why(x);
  const badge="<span class='badge "+(type==="Distressed"?"distressed":"property")+"'>"+esc(type)+(type==="Distressed"&&x.distress_reason?" · "+esc(x.distress_reason):"")+"</span>";
  tr.innerHTML="<td><b>"+score(x)+"</b></td><td>"+badge+"<br><b>"+esc(x.address)+"</b><div class='small'>"+esc(x.city)+" · $"+n(x.estimated_value).toLocaleString()+(x.owner_name?" · "+esc(x.owner_name):"")+"</div></td><td>"+(rs.length?rs.map(v=>"<span class='pill'>"+esc(v)+"</span>").join(""):"<span class='small'>Needs research</span>")+"</td><td>"+esc(x.status)+"</td>";
  tr.onclick=()=>openEditor(x.id);tb.appendChild(tr)
 });
 drawMarkers(list);
}
async function load(){
 const d=await api({action:"list"});leads=d.leads||[];render();
}
function openEditor(id){
 const x=leads.find(z=>z.id===id)||{id:"",address:"",city:"Santa Clara",owner_name:"",estimated_value:0,dom:0,years_owned:0,equity_pct:0,appreciation_pct:0,units:1,lead_type:"Property",status:"New",notes:""};
 $("leadId").value=x.id||"";$("address").value=x.address;$("city").value=x.city;$("owner").value=x.owner_name||"";$("value").value=x.estimated_value||"";$("dom").value=x.dom||"";$("years").value=x.years_owned||"";$("equity").value=x.equity_pct||"";$("appreciation").value=x.appreciation_pct||"";$("units").value=x.units||1;$("leadType").value=x.lead_type||"Property";$("distressReason").value=x.distress_reason||"";$("leadStatus").value=x.status||"New";$("notes").value=x.notes||"";
 ["expired","preforeclosure","probate","remodel","absentee"].forEach(k=>$(k).checked=!!x[k]);
 $("delete").style.visibility=x.id?"visible":"hidden";$("editor").className="panel editor on";window.scrollTo({top:0,behavior:"smooth"});
}
function closeEditor(){$("editor").className="panel editor"}
async function unlock(){
 accessKey=$("accessKey").value.trim();$("loginError").textContent="";
 try{await load();localStorage.setItem(KEY_STORE,accessKey);$("login").style.display="none";$("app").style.display="block";$("topActions").style.display="flex";setTimeout(()=>map&&map.invalidateSize(),100)}
 catch(e){$("loginError").textContent="Access key not accepted."}
}
$("unlock").onclick=unlock;$("accessKey").onkeydown=e=>{if(e.key==="Enter")unlock()};
$("lock").onclick=()=>{localStorage.removeItem(KEY_STORE);location.reload()};
$("add").onclick=()=>openEditor(null);$("cancel").onclick=closeEditor;
$("save").onclick=async()=>{
 if(!$("address").value.trim()){alert("Address required");return}
 const lead={id:$("leadId").value||undefined,address:$("address").value.trim(),city:$("city").value.trim()||"Santa Clara",owner_name:$("owner").value.trim(),estimated_value:n($("value").value),dom:n($("dom").value),years_owned:n($("years").value),equity_pct:n($("equity").value),appreciation_pct:n($("appreciation").value),units:n($("units").value)||1,lead_type:$("leadType").value,distress_reason:$("distressReason").value,status:$("leadStatus").value,expired:$("expired").checked,preforeclosure:$("preforeclosure").checked,probate:$("probate").checked,remodel:$("remodel").checked,absentee:$("absentee").checked,notes:$("notes").value.trim()};
 try{await api({action:"upsert",lead});await load();closeEditor();msg("Lead saved")}
 catch(e){alert(e.message)}
};
$("delete").onclick=async()=>{const id=$("leadId").value;if(!id||!confirm("Delete this lead?"))return;try{await api({action:"delete",id});await load();closeEditor();msg("Lead deleted")}catch(e){alert(e.message)}};
$("showMap").onclick=async()=>{
 const temp={address:$("address").value.trim(),city:$("city").value.trim()||"Santa Clara"};if(!temp.address)return;
 const ll=await geocodeLead(temp,true);if(!ll){alert("Could not locate address.");return}
 const id=$("leadId").value;if(id){const x=leads.find(z=>z.id===id);if(x){x.lat=ll[0];x.lng=ll[1];try{await api({action:"upsert",lead:x});await load()}catch(e){}}}
 closeEditor();
};
$("csv").onclick=()=>{
 const h=["Lead Type","Distress Reason","Score","Address","City","Owner","Value","DOM","Years Owned","Equity %","Appreciation %","Units","Status","Notes"],rows=[h,...leads.map(x=>[x.lead_type||"Property",x.distress_reason||"",score(x),x.address,x.city,x.owner_name,x.estimated_value,x.dom,x.years_owned,x.equity_pct,x.appreciation_pct,x.units,x.status,x.notes])];
 const csv="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")).join("\r\n");const b=new Blob([csv],{type:"text/csv"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="lead-engine.csv";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
};
["search","cityFilter","min","max","signalFilter"].forEach(id=>{$(id).oninput=render;$(id).onchange=render});
document.querySelectorAll(".viewtab").forEach(btn=>btn.onclick=()=>{
 currentView=btn.dataset.view;
 document.querySelectorAll(".viewtab").forEach(b=>b.classList.toggle("active",b===btn));
 render();
});
$("preforeclosure").onchange=()=>{if($("preforeclosure").checked){$("leadType").value="Distressed";if(!$("distressReason").value)$("distressReason").value="Pre-foreclosure / NOD"}};
$("leadType").onchange=()=>{if($("leadType").value==="Property")$("distressReason").value=""};
if(accessKey){$("accessKey").value=accessKey;unlock()}
})();
</script>
</body></html>
